name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  FOUNDRY_PROFILE: ci

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Pinned, not `stable`. This repo builds with `deny = "warnings"`, so a
      # newer forge that adds a lint turns a green build red with no code change
      # -- which is exactly what happened on the first push, when a `stable`
      # runner flagged block.timestamp comparisons that v1.5.0 does not know
      # about. Pinning keeps CI reproducible and consistent with the pinned
      # solc and pinned dependencies.
      #
      # To bump: raise this version, run `forge build` locally with the same
      # version, and resolve any new lints deliberately.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.0

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      # Fork tests are excluded here: they need RH_RPC_URL and pin a mainnet
      # block, so they must not gate CI. Run them locally, see README.
      - name: Test
        run: forge test -vv --no-match-path 'test/fork/*'
