name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  FOUNDRY_PROFILE: ci

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      # Fork tests are excluded here: they need RH_RPC_URL and pin a mainnet
      # block, so they must not gate CI. Run them locally, see README.
      - name: Test
        run: forge test -vv --no-match-path 'test/fork/*'
